# Remap prefix to Ctrl+a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# General
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g history-limit 100000
set -g renumber-windows on

# Intuitive splits (in current path)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# New window in current path
bind c new-window -c "#{pane_current_path}"

# Pane traversal using hjkl
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes with prefix + H/J/K/L
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Alt+arrow to switch panes without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded!"

# Status bar
set -g status-position bottom
set -g status-style bg=colour235,fg=colour248
set -g status-left "#[bg=colour24,fg=white,bold]  #S #[bg=colour235] "
set -g status-right "#[fg=colour244] %a %d %b #[bg=colour24,fg=white,bold] %H:%M "
set -g status-left-length 30
setw -g window-status-format " #I:#W "
setw -g window-status-current-format "#[bg=colour24,fg=white,bold] #I:#W "

# Active pane border
set -g pane-border-style fg=colour238
set -g pane-active-border-style fg=green,bold
